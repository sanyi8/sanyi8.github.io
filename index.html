<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sandor Kardos</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --lime: #d8ff88; --bg: #090909; }
body { background: var(--bg); min-height: 100vh; font-family: 'Space Mono', monospace; overflow-x: hidden; }
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 200; opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.container { max-width: 680px; margin: 0 auto; padding: 48px 22px 60px; }

.eyebrow {
  font-size: 9px; letter-spacing: 0.22em; color: var(--lime);
  text-transform: uppercase; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
  opacity: 0; transform: translateY(12px);
  animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
}
.dot { width: 6px; height: 6px; background: var(--lime); border-radius: 50%; flex-shrink: 0; animation: pulse 2.2s ease-in-out infinite; }

/* ── Name: image fill on hover (first effect) ── */
.name-wrap {
  display: inline-block;
  opacity: 0; transform: translateY(16px);
  animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
}
.name-row { display: flex; line-height: 1; }

.name-letter {
  font-family: 'Bebas Neue', Impact, sans-serif;
  font-size: clamp(46px, 10.5vw, 80px);
  line-height: 0.88; letter-spacing: -0.01em;
  cursor: pointer;
  position: relative; display: inline-block; overflow: hidden;
  opacity: 0;
  animation: letterPop 0.55s cubic-bezier(0.34,1.56,0.64,1) var(--delay,0s) forwards;
}
.name-letter .l-base { display: block; color: #fff; transition: opacity 0.08s; position: relative; }
.name-letter .l-img {
  position: absolute; inset: 0; display: block; opacity: 0;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 220% 220%; background-position: center;
  transition: opacity 0.1s, background-position 3s ease-in-out;
}
.name-letter .l-flash { position: absolute; inset: 0; display: block; color: var(--lime); pointer-events: none; opacity: 0; }
.name-letter:hover .l-base { opacity: 0; }
.name-letter:hover .l-img  { opacity: 1; background-position: 80% 20%; }
.name-letter.accent .l-base { color: var(--lime); }

/* Tagline */
.tagline {
  font-size: 11px; color: #888;
  margin-top: 20px; line-height: 1.9;
  opacity: 0; transform: translateY(12px);
  animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 1.1s forwards;
}
.tagline strong { color: #aaa; font-weight: 700; }

/* BSc line: own row, no wrap, no background */
.tagline-bsc {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  font-size: 11px;
  color: #888;
  line-height: 1.9;
}

/* Links */
.links { border-top: 1px solid #1a1a1a; margin-top: 48px; }
.link-item {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid #1a1a1a; padding: 18px 0;
  text-decoration: none; cursor: pointer; overflow: hidden;
  transition: border-color 0.3s;
  opacity: 0; transform: translateX(-16px);
}
.link-item:hover { border-color: transparent; }
.u-reveal { position: absolute; bottom: 0; left: 0; height: 1px; width: 100%; background: var(--lime); transform: scaleX(0); transform-origin: left; transition: transform 0.45s cubic-bezier(0.16,1,0.3,1); }
.link-item:hover .u-reveal { transform: scaleX(1); }
.link-num { font-size: 9px; color: #1e1e1e; width: 22px; flex-shrink: 0; transition: color 0.3s; display: none; }
@media(min-width:480px){ .link-num { display: block; } }
.link-item:hover .link-num { color: #555; }
.link-text { flex: 1; padding-left: 0; }
@media(min-width:480px){ .link-text { padding-left: 12px; } }
.link-heading { font-family: 'Bebas Neue', Impact, sans-serif; font-size: clamp(30px, 6.5vw, 54px); color: #333; letter-spacing: -0.01em; line-height: 1; display: block; transition: color 0.2s, transform 0.4s cubic-bezier(0.16,1,0.3,1); }
.link-item:hover .link-heading { color: #fff; transform: translateX(-8px); }
.link-sub { font-size: 10px; color: transparent; margin-top: 4px; letter-spacing: 0.03em; display: block; transition: color 0.25s, transform 0.3s; transform: translateY(5px); }
.link-item:hover .link-sub { color: #666; transform: translateY(0); }
.hover-img { position: absolute; z-index: 20; width: 155px; height: 100px; object-fit: cover; border-radius: 8px; box-shadow: 0 16px 48px rgba(0,0,0,0.85); pointer-events: none; opacity: 0; transform: scale(0.7) rotate(-10deg); transition: opacity 0.25s, transform 0.35s cubic-bezier(0.16,1,0.3,1); top: 50%; left: 50%; translate: -10% -50%; }
.link-item:hover .hover-img { opacity: 1; transform: scale(1) rotate(6deg); }
.link-arrow { flex-shrink: 0; margin-left: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid #1e1e1e; display: flex; align-items: center; justify-content: center; transform: translateX(60px); opacity: 0; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.3s, border-color 0.3s, background 0.3s; }
.link-item:hover .link-arrow { transform: translateX(0); opacity: 1; border-color: var(--lime); background: rgba(216,255,136,0.07); }
.link-arrow svg { width: 14px; height: 14px; stroke: var(--lime); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

.footer { margin-top: 44px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 9px; color: #252525; letter-spacing: 0.1em; opacity: 0; animation: fadeUp 0.5s ease 1.6s forwards; }
.footer a { color: #444; text-decoration: none; transition: color 0.2s; }
.footer a:hover { color: var(--lime); }

@keyframes fadeUp    { to { opacity: 1; transform: translateY(0); } }
@keyframes pulse     { 0%,100%{opacity:1} 50%{opacity:0.2} }
@keyframes letterPop { 0%{opacity:0;transform:scale(0.5)} 60%{transform:scale(1.08)} 100%{opacity:1;transform:scale(1)} }
@keyframes flashOn   { 0%{opacity:0} 8%{opacity:1} 65%{opacity:1} 100%{opacity:0} }
</style>
</head>
<body>
<div class="container">

  <p class="eyebrow"><span class="dot"></span>Creative Technologist &nbsp;·&nbsp; Edinburgh</p>

  <div class="name-wrap">
    <div class="name-row" id="row1"></div>
    <div class="name-row" id="row2"></div>
  </div>

  <p class="tagline">
    <strong>AI automation, n8n workflows, WordPress plugins, product design.</strong><br>
    <span class="tagline-bsc">BSc Digital Media and Interaction Design, Napier University, Sept 2026, 3rd year entry.</span>
  </p>

  <nav class="links" id="links"></nav>

  <div class="footer">
    <a href="https://sandorkardos.com" target="_blank">sandorkardos.com</a>
    <a href="https://ko-fi.com/sandorko">&#9749; ko-fi.com/sandorko</a>
  </div>
</div>

<script>
const SANDOR_IMGS = ["https://picsum.photos/seed/sk0/300/200", "https://picsum.photos/seed/sk1/300/200", "https://picsum.photos/seed/sk2/300/200", "https://picsum.photos/seed/sk3/300/200", "https://picsum.photos/seed/sk4/300/200", "https://picsum.photos/seed/sk5/300/200"];
const KARDOS_IMGS = ["https://picsum.photos/seed/kr0/300/200", "https://picsum.photos/seed/kr1/300/200", "https://picsum.photos/seed/kr2/300/200", "https://picsum.photos/seed/kr3/300/200", "https://picsum.photos/seed/kr4/300/200", "https://picsum.photos/seed/kr5/300/200"];

function buildRow(rowId, word, imgs, accent, baseDelay) {
  const row = document.getElementById(rowId);
  word.split("").forEach((ch, i) => {
    const el = document.createElement("span");
    el.className = "name-letter" + (accent ? " accent" : "");
    el.style.setProperty("--delay", `${baseDelay + i * 0.07}s`);
    el.innerHTML = `<span class="l-base">${ch}</span><span class="l-img" style="background-image:url('${imgs[i]}')">${ch}</span><span class="l-flash">${ch}</span>`;
    row.appendChild(el);
  });
}
buildRow("row1","SANDOR",SANDOR_IMGS,false,0.35);
buildRow("row2","KARDOS",KARDOS_IMGS,true,0.88);

setTimeout(() => {
  document.querySelectorAll(".name-letter").forEach((el, i) => {
    setTimeout(() => {
      el.querySelector(".l-flash").style.animation = "flashOn 0.5s ease forwards";
    }, i * 60);
  });
}, 1900);

  arrow: `<svg viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>`,
  dl:    `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  mail:  `<svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`,
};
const LINKS = [
  { heading:"Projects",   sub:"n8n automations, WordPress plugins, AI integrations",    img:SKYE,    href:"https://github.com/sanyi8/MVPs",                                              icon:"arrow" },
  { heading:"Playground", sub:"CodePen experiments, JS sketches, interactive things",    img:NATH,    href:"https://codepen.io/kod3ks",                                                   icon:"arrow" },
  { heading:"Design",     sub:"Visual work, brand identity, UI and graphic design",      img:SHELDON, href:"https://behance.net/kardoss",                                                 icon:"arrow" },
  { heading:"CV",         sub:"Background, skills, education and what I am looking for", img:NIK,     href:"https://sandorkardos.com/wp-content/uploads/2026/03/Sandor-Kardos-CV.pdf",   icon:"dl"    },
  { heading:"Contact",    sub:"Open to internships, freelance, and interesting problems", img:VOLO,    href:"https://sandorkardos.com/contact_me/",                                        icon:"mail"  },
];

const nav = document.getElementById("links");
LINKS.forEach((item, i) => {
  const a = document.createElement("a");
  a.className = "link-item";
  a.href = item.href;
  if (item.icon === "dl") a.setAttribute("target", "_blank");
  a.style.animation = `fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) ${0.6 + i * 0.09}s forwards`;
  a.innerHTML = `
    <span class="link-num">${String(i+1).padStart(2,"0")}</span>
    <span class="link-text">
      <span class="link-heading">${item.heading}</span>
      <span class="link-sub">${item.sub}</span>
    </span>
    <img class="hover-img" src="${item.img}" alt="${item.heading}" loading="lazy">
    <span class="link-arrow">${ICONS[item.icon]}</span>
    <span class="u-reveal"></span>
  `;
  a.addEventListener("mousemove", e => {
    const r = a.getBoundingClientRect();
    const img = a.querySelector(".hover-img");
    img.style.left = `${38 + (e.clientX - r.left) / r.width * 22}%`;
    img.style.top  = `${38 + (e.clientY - r.top)  / r.height * 22}%`;
  });
  nav.appendChild(a);
});
